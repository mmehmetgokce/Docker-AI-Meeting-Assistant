services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: meeting_assistant_db
    restart: always
    environment:
      POSTGRES_DB: meeting_db
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - meeting_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. pgAdmin Management UI
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meeting_assistant_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - meeting_network
    depends_on:
      - postgres

  # ==========================================
  # 3. Ollama LLM Service
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: meeting_assistant_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - meeting_network
    # GPU desteği varsa çalıştırmak için (isteğe bağlı):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ==========================================
  # 4. Custom Web UI & Backend (Port 3000)
  # ==========================================
  web-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: meeting_assistant_webui
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=meeting_db
      - DB_USER=meeting_user
      - DB_PASSWORD=meeting_password
      - OLLAMA_URL=http://ollama:11434
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/meeting-notes
    volumes:
      - ./prompts:/prompts:ro
    networks:
      - meeting_network
    depends_on:
      - postgres
      - ollama




  # ==========================================
  # 5. n8n Workflow Automation
  # ==========================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: meeting_assistant_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - meeting_network
    depends_on:
      - postgres
      - ollama

networks:
  meeting_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  n8n_data:
